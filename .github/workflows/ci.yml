name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip

      - name: Install project
        run: |
          python -m pip install -e ".[dev]"

      - name: Verify package import
        run: |
          python -c "import openphenomena; print(openphenomena.__file__)"

      - name: Verify plugin discovery
        run: |
          python - <<'PY'
          from openphenomena.core import PluginRegistry

          registry = PluginRegistry.discover()
          print(tuple(sorted(registry.plugin_ids)))
          PY

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Check formatting
        run: |
          python -m ruff format --check .

      - name: Run lint
        run: |
          python -m ruff check .

      - name: Run strict type checking
        run: |
          python -m mypy src

      - name: Compile Python sources
        run: |
          python -m compileall -q src tests
