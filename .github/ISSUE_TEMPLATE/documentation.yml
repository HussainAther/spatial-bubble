name: Documentation improvement
description: Report missing, unclear, or incorrect documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Document or location
      placeholder: README.md, docs/VALIDATION.md, API docstring
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true

  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked the current main branch.
          required: true
