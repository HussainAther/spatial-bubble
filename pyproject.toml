[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openphenomena"
version = "0.1.0"
description = "Scientific simulation and visualization of natural phenomena"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
authors = [{name = "Open Phenomena contributors"}]
dependencies = ["numpy>=1.26"]
[project]
name = "openphenomena"
version = "0.1.0"
description = "Validated scientific simulation and spatial visualization of natural phenomena, beginning with soap-film and bubble physics."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }

authors = [
  { name = "Syed Hussain Ather" },
]

maintainers = [
  { name = "Syed Hussain Ather" },
]

keywords = [
  "scientific-computing",
  "computational-physics",
  "capillary-surfaces",
  "soap-bubbles",
  "thin-film-optics",
  "scientific-visualization",
  "spatial-computing",
  "reproducible-research",
]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/HussainAther/spatial-bubble"
Repository = "https://github.com/HussainAther/spatial-bubble"
Issues = "https://github.com/HussainAther/spatial-bubble/issues"
Documentation = "https://github.com/HussainAther/spatial-bubble/tree/main/docs"

[project.scripts]
openphenomena-reference = "openphenomena.reference:main"
openphenomena-closed-sphere = "openphenomena.equilibrium.reference:main"

[project.entry-points."openphenomena.plugins"]
soap_bubble_reference = "openphenomena.plugins.soap_bubble:SoapBubbleReferencePlugin"

[project.optional-dependencies]
scipy = ["scipy>=1.15,<2"]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
  "scipy>=1.15,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openphenomena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["openphenomena"]


