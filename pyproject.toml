[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openphenomena"
version = "0.1.0"
description = "Scientific simulation and visualization of natural phenomena"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
authors = [{name = "Open Phenomena contributors"}]
dependencies = ["numpy>=1.26"]

[project.scripts]
openphenomena-reference = "openphenomena.reference:main"

[project.entry-points."openphenomena.plugins"]
soap_bubble_reference = "openphenomena.plugins.soap_bubble:SoapBubbleReferencePlugin"

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openphenomena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["openphenomena"]
